# A utiliser seulement si nginx tourne deja sur le VPS (sinon, prefere Caddy).
# Le certificat s'obtient ensuite avec : sudo certbot --nginx -d scenario.exemple.fr
server {
    listen 80;
    server_name scenario.exemple.fr;

    client_max_body_size 40m;

    location / {
        proxy_pass http://127.0.0.1:8777;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Writer-Share lit la DERNIERE adresse de cet en-tete pour limiter les essais de connexion.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Indispensable pour le temps reel et pour les longues analyses IA.
        proxy_buffering off;
        proxy_read_timeout 1h;
        add_header Referrer-Policy "no-referrer" always;
    }
}
